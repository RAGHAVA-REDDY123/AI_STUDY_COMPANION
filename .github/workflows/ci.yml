name: CI - Lint, Test & Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Testing & Schema Integrity
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: test_study_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8 pytest-asyncio

      - name: Run Syntax & Lint Check (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Initialize Test Database & pgvector Extension
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@127.0.0.1:5432/test_study_companion
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: ci_test_secret_key_1234567890_abcdef
          PYTHONPATH: .
        run: |
          python -c "import asyncio; from app.core.init_db import init_db; asyncio.run(init_db())"

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@127.0.0.1:5432/test_study_companion
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: ci_test_secret_key_1234567890_abcdef
          GEMINI_API_KEY: fake_ci_key_for_offline_mock
          GEMINI_MODEL: gemini-2.5-flash
          AI_COST_TRACKING_ENABLED: "false"
          AI_LOGGING_ENABLED: "false"
          PYTHONPATH: .
        run: |
          python -m pytest tests/

  # -------------------------------------------------------------
  # Job 2: Frontend Typecheck & Production Build
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Strict Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Verify Production Next.js Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Docker Build Verification
  # -------------------------------------------------------------
  docker-build-check:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-study-companion-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-study-companion-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
