name: CD - Build & Publish Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Publish to GitHub Container Registry (GHCR)
  # -------------------------------------------------------------
  publish-images:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo-name
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # Backend Image Build & Push
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.owner }}/ai-study-companion-backend:latest
            ghcr.io/${{ steps.repo-name.outputs.owner }}/ai-study-companion-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image Build & Push
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.owner }}/ai-study-companion-frontend:latest
            ghcr.io/${{ steps.repo-name.outputs.owner }}/ai-study-companion-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 2: Cloud Deployment Trigger (Optional Webhook)
  # -------------------------------------------------------------
  trigger-deploy:
    name: Trigger Cloud Deployment Hook
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: success()

    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl -s -X POST "$RENDER_HOOK"
            echo "Deploy hook successfully triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set in repository secrets. Skipping webhook."
          fi
